[project]
name = "che126-sims"
version = "0.1.0"
description = "LAMMPS MD of PE/PP battery separators across 25-160 C at all-atom, united-atom, and coarse-grained resolution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "mdanalysis>=2.10.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
sepsim = "sepsim.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sepsim"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
