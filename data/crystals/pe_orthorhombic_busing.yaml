# Orthorhombic polyethylene, 23 C cell. Zigzag geometry is generated by the builder.
name: pe_orthorhombic_busing
polymer: polyethylene
form: orthorhombic
citations:
  cell:
    authors: "Busing, W. R."
    title: "X-ray diffraction study of disorder in Allied Signal Spectra-1000 polyethylene fibers"
    journal: "Macromolecules"
    year: 1990
    volume: 23
    pages: "4608-4610"
    verified_against_primary: false
    note: "Cell constants as cited in secondary sources."
  setting_angle:
    authors: "Bunn, C. W."
    journal: "Trans. Faraday Soc."
    year: 1939
    volume: 35
    pages: "482"
space_group:
  symbol: "Pnam"
  number: 62
  note: "Non-standard setting of Pnma (No. 62)."
cell:  # 23 C; angstrom and degrees
  a: 7.4069
  b: 4.9491
  c: 2.5511
  alpha: 90.0
  beta: 90.0
  gamma: 90.0
  chain_axis: c
  temperature_C: 23
chains_per_cell: 2
ch2_per_cell: 4
ch2_molar_mass_g_mol: 14.027
chains:  # fractional (x, y) of chain axes; setting angle sign per chain
  - {xy: [0.0, 0.0], setting_angle_sign: +1}
  - {xy: [0.5, 0.5], setting_angle_sign: -1}
setting_angle:
  definition: "angle between the zigzag (C-C-C) plane and the b axis"
  value_deg: 41  # Bunn 1939; project choice D27
  alternatives:
    - {value_deg: 45, source: "Chatani et al."}
zigzag:
  bond_CC_A: [1.53, 1.54]
  angle_CCC_deg: 112  # approximate
  constraint: "c = 2 * l * sin(theta / 2)"  # l = C-C bond length, theta = C-C-C angle
  note: >-
    The builder must choose l and theta consistent with both the force field and the cell
    constant c = 2.5511 A (e.g. fix one and solve the constraint for the other).
verification:
  computed: "2026-10-16"
  density_g_cm3: 0.9963  # 4 x 14.027 g/mol in the cell above
