  respectively, with bonds 1.539-1.544 A. The table (used for the published structure-factor
  fit, R = 0.152) is treated as authoritative; the text angles are recorded as stated_angles and
  the computed ones as coordinate_angles. Force-field minimization relaxes angles anyway.
